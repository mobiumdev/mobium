[build-system]
# 77 for `license` as an SPDX expression and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mobium"
version = "0.1.0"
description = "Drive mobile apps on Android emulators, Android phones, iOS simulators and iPhones. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Lana Begunova" }]
keywords = ["mobile", "automation", "testing", "android", "ios", "uiautomator2", "webdriveragent", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mobiumdev/mobium"
Documentation = "https://github.com/mobiumdev/mobium/blob/main/docs/quickstart/python.md"
Source = "https://github.com/mobiumdev/mobium/tree/main/clients/python"
Issues = "https://github.com/mobiumdev/mobium/issues"

[tool.setuptools.packages.find]
include = ["mobium*"]

[tool.setuptools.package-data]
# Type checkers read the annotations only from a package that ships this.
mobium = ["py.typed"]
