# Everything that can be checked without a device.
#
# The job body is `make ci` rather than a list of steps, so this file and a
# person checking before a commit run exactly the same thing. Adding a check
# here without adding it to the Makefile would give CI a coverage the
# developer cannot reproduce, which is how a green build starts meaning less
# than it should.
#
# What this deliberately does NOT cover is in docs/RELEASE-CHECKLIST.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes an in-flight run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read from go.mod so the version is stated once. Both modules
          # declare the same one; the root is the source of truth.
          go-version-file: go.mod
          # Two modules, so both lock files matter to the cache key.
          cache-dependency-path: |
            go.sum
            clients/go/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The Java client builds through its Maven wrapper, which fetches a
      # pinned, checksum-verified Maven and the pinned plugins; the client
      # itself has no dependencies. The cache keeps those downloads between
      # runs.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: clients/java/pom.xml

      # The .NET client targets netstandard2.0 and its tests run on the
      # SDK's own runtime, so the SDK is all that is needed -- no NuGet
      # restore, because the client has no dependencies.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Pinned and checksum-verified by the Makefile, so CI and a developer's
      # machine run the same linter at the same version.
      - name: Install golangci-lint
        run: make lint-install

      - name: make ci
        run: make ci

      - name: Build the binary
        run: make build

      # A smoke test that the thing that just built actually runs. `--help`
      # exercises the whole cobra command tree, which has caught a duplicate
      # command registration before it reached anyone.
      - name: Smoke test
        run: |
          ./bin/mobium --version
          ./bin/mobium --help > /dev/null
          test "$(./bin/mobium --help | grep -cE '^  [a-z-]+ ')" -ge 20

  # The .NET client on Windows, where it is most likely to be used and where
  # the command line it hand-quotes is parsed by CommandLineToArgvW. Its tests
  # start a fake `mobium pipe` (the test program itself), so no mobium binary
  # is needed -- which is why this can run before the daemon supports Windows.
  dotnet-windows:
    name: .NET client on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: make dotnet
        shell: bash
        run: make dotnet
